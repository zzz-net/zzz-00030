intake_dir: D:\workSpace\AI__SPACE\zzz-00030\test_migration_run\intake
target_base: D:\workSpace\AI__SPACE\zzz-00030\test_migration_run\target_v2
operator: operator_v2

rules:
  case_number_pattern: "(\\d{4}-[A-Z]\\d{3}-\\d{3})"
  file_pattern: "(\\d{4}-[A-Z]\\d{3}-\\d{3})\\.(pdf|jpg|jpeg|png|tiff|bmp)$"
  allowed_extensions:
    - .pdf
    - .jpg
    - .jpeg
    - .png
    - .tiff
    - .bmp
  illegal_name_patterns:
    - pattern: "[^a-zA-Z0-9\\-_\\.]"
      message: "文件名包含非法字符"
    - pattern: "^(?!\\d{4}-[A-Z]\\d{3}-\\d{3})"
      message: "文件名必须以档案号开头"
  target_structure: "{case_number}"
  action: copy

batch:
  max_size: 100
  stop_on_failure_ratio: 0.3

logging:
  dir: D:\workSpace\AI__SPACE\zzz-00030\test_migration_run\data
  action_log: action_log.jsonl
  queue_file: queue.json
  error_queue_file: error_queue.json
  batch_history_file: batch_history.json

watch:
  poll_interval: 3
