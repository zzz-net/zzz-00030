intake_dir: D:\workSpace\AI__SPACE\zzz-00030\reviewer_filepattern_case\intake
target_base: D:\workSpace\AI__SPACE\zzz-00030\reviewer_filepattern_case\target
operator: reviewer

rules:
  case_number_pattern: '(\d{4}-[A-Z]\d{3})'
  file_pattern: '(LEGACY_[A-Z]+_\d+)\.(pdf|jpg|jpeg|png|tiff|bmp)$'
  allowed_extensions:
    - .pdf
  illegal_name_patterns: []
  target_structure: '{case_number}'
  action: move

batch:
  max_size: 50
  stop_on_failure_ratio: 0.5

logging:
  dir: D:\workSpace\AI__SPACE\zzz-00030\reviewer_filepattern_case\data
  action_log: action_log.jsonl
  queue_file: queue.json
  error_queue_file: error_queue.json
  batch_history_file: batch_history.json

watch:
  poll_interval: 5
